[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "Shameet-docchat"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "groq",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["chat"]
packages =  ["tools"]

[project.scripts]
chat = "chat:repl"